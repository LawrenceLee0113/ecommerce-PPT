<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cover Font Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 36px;
        background: #e6e1dc;
        color: #3f3f3e;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        font-weight: 400;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
      }

      figure {
        margin: 0;
        padding: 16px;
        border: 1px solid #5f5c5b;
        background: #f7f7f2;
      }

      figcaption {
        margin-bottom: 12px;
        font-size: 19px;
        font-weight: 400;
      }

      img {
        display: block;
        width: 100%;
        border: 1px solid #5f5c5b;
      }
    </style>
  </head>
  <body>
    <h1>封面中文字體比較</h1>
    <div class="grid">
      <figure>
        <figcaption>01 Noto Serif TC</figcaption>
        <img src="./cover-noto-serif.png" alt="Noto Serif TC cover preview" />
      </figure>
      <figure>
        <figcaption>02 Chiron Sung HK</figcaption>
        <img src="./cover-chiron-sung.png" alt="Chiron Sung HK cover preview" />
      </figure>
      <figure>
        <figcaption>03 IBM Plex Sans TC</figcaption>
        <img src="./cover-ibm-plex.png" alt="IBM Plex Sans TC cover preview" />
      </figure>
      <figure>
        <figcaption>04 Noto Sans TC</figcaption>
        <img src="./cover-noto-sans.png" alt="Noto Sans TC cover preview" />
      </figure>
      <figure>
        <figcaption>05 LXGW WenKai TC</figcaption>
        <img src="./cover-lxgw-wenkai.png" alt="LXGW WenKai TC cover preview" />
      </figure>
    </div>
  </body>
</html>
